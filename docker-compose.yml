services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookly
      POSTGRES_PASSWORD: hookly
      POSTGRES_DB: hookly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "9901:9901"   # admin UI + Prometheus metrics + fault injection API
    command: envoy -c /etc/envoy/envoy.yaml --log-level warn
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9901/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zipkin collects traces from Envoy's http_egress listener.
  # UI: http://localhost:9411
  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

  migrate:
    image: hookly
    build: .
    command: sqlx migrate run
    environment: &env
      DATABASE_URL: postgres://hookly:hookly@envoy:5432/hookly
      REDIS_URL: redis://envoy:6379
      # Route external HTTP(S) calls through Envoy for telemetry + fault injection.
      # reqwest reads these automatically — no code changes needed.
      HTTP_PROXY: http://envoy:3128
      HTTPS_PROXY: http://envoy:3128
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "3000"
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY}
      CRYPTO_API_KEY_ENCRYPTION_KEY: ${CRYPTO_API_KEY_ENCRYPTION_KEY}
      RUST_LOG: info
    depends_on:
      envoy:
        condition: service_healthy

  api:
    image: hookly
    build: .
    command: /usr/local/bin/hookly
    environment: *env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: hookly
    build: .
    command: /usr/local/bin/worker
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: hookly
    build: .
    command: /usr/local/bin/scheduler
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully
