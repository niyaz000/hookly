[package]
name = "hookly"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["tokio", "json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_qs = "0.13"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
reqwest = { version = "0.12", features = ["json"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"

async-trait = "0.1"
dotenvy = "0.15"
envy = "0.4"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
nanoid = "0.5"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
validator = { version = "0.18", features = ["derive"] }
jsonschema = "0.29"

aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
p384 = { version = "0.13", features = ["pkcs8", "pem"] }
rsa = { version = "0.9", features = ["pem"] }

[[bin]]
name = "hookly"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/worker/main.rs"

[[bin]]
name = "scheduler"
path = "src/scheduler/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1.0"
