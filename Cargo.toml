[package]
name = "hookly"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["tokio", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"
envy = "0.4"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
nanoid = "0.5"
chrono = { version = "0.4", features = ["serde"] }
